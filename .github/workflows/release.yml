name: Build and Release Liminal Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Application Icons
        run: npm run build-icon

      # === Draft Release 먼저 생성 ===
      - name: Create GitHub Release Draft
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Liminal Desktop 자동화 및 다중 분기 제어 엔진 안정화 릴리스 버전입니다.
            
            **변경사항은 Release Notes를 확인해주세요.**
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # === electron-builder로 빌드 + 기존 Draft에 업로드 ===
      - name: Build and Publish Electron App
        run: npm run package -- --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # 필요하면 아래도 추가
          # DEBUG: electron-builder